# SP6 target: a contract that only requires the caller's auth and moves no tokens.
# Standalone crate (own [workspace]) so it never touches the main contracts workspace.
[package]
name = "sp6_ping"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
